<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="dashboard" href="/tabs/dashboard">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
      <ion-label>{{ 'tabs.home' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="pos" href="/tabs/pos">
      <ion-icon aria-hidden="true" name="cart-outline"></ion-icon>
      <ion-label>{{ 'tabs.pos' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="products" href="/tabs/products">
      <ion-icon aria-hidden="true" name="cube-outline"></ion-icon>
      <ion-label>{{ 'tabs.products' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="stock" href="/tabs/stock">
      <ion-icon aria-hidden="true" name="alert-circle-outline"></ion-icon>
      <ion-label>{{ 'tabs.stock' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="more" href="/tabs/more">
      <ion-icon aria-hidden="true" name="menu-outline"></ion-icon>
      @if (unreadCount() > 0) {
        <ion-badge color="danger">{{ unreadCount() }}</ion-badge>
      }
      <ion-label>{{ 'tabs.more' | translate }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
