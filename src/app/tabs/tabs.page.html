<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="dashboard" href="/tabs/dashboard">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
      <ion-label>الرئيسية</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="products" href="/tabs/products">
      <ion-icon aria-hidden="true" name="cube-outline"></ion-icon>
      <ion-label>المنتجات</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="notifications" href="/tabs/notifications">
      <ion-icon aria-hidden="true" name="notifications-outline"></ion-icon>
      @if (unreadCount() > 0) {
        <ion-badge color="danger">{{ unreadCount() }}</ion-badge>
      }
      <ion-label>الإشعارات</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile" href="/tabs/profile">
      <ion-icon aria-hidden="true" name="person-outline"></ion-icon>
      <ion-label>حسابي</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
